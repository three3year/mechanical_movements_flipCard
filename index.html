<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>機構圖鑑</title>
  <link rel="stylesheet" href="style.css">
  <!-- 模型用的 Three.js:固定版本,第一次切到模型才會真正下載 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="book">
    <header>
      <h1>機構圖鑑</h1>
      <p class="subtitle"><a href="https://ia803103.us.archive.org/12/items/Mechanical_Movements_507/Mechanical_Movements_507.pdf" target="_blank" rel="noopener">Mechanical Movements</a> · 圖文對照</p>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <main class="viewer">
      <button class="back" id="back" hidden></button>
      <article class="card" id="card"></article>
      <div class="pager">
        <button id="prev">‹ 上一張</button>
        <span class="pos" id="pos"></span>
        <button id="next">下一張 ›</button>
      </div>
    </main>

    <footer id="footer"></footer>
  </div>

  <script src="data.js"></script>
  <script>
    const tabsEl = document.getElementById("tabs");
    const cardEl = document.getElementById("card");
    const posEl = document.getElementById("pos");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    const footerEl = document.getElementById("footer");

    let chapterIndex = 0;
    let entryIndex = 0;
    let renderSeq = 0;
    const backEl = document.getElementById("back");
    const backStack = []; // 交互參照的跳轉來源,可多層依序退回

    // ── 模型 ──
    // 圖片區模式(插圖 / 模型)是頁面層級的狀態,翻頁、切章、交互參照都保留;
    // 卡片沒有模型時只是暫時顯示插圖,不清除這個狀態。
    let figMode = "illustration";
    let selectedFig = null; // 多插圖條目在模型模式下選中的圖號
    let registry = null; // 圖號 → 模型定義;ES module 載入失敗(如 file:// 開啟)時維持 null,不出現切換
    let viewerPromise = null;
    let viewerModule = null;

    import("./models/registry.js").then(
      (m) => {
        registry = m.registry;
        render();
      },
      () => {},
    );

    // 3D 函式庫延遲到第一次切到模型才載入;失敗時清掉快取,下次切換可重試
    function loadViewer() {
      viewerPromise ??= import("./viewer/viewer.js").then(
        (m) => (viewerModule = m),
        (err) => {
          viewerPromise = null;
          throw err;
        },
      );
      return viewerPromise;
    }

    const figureNo = (src) => parseInt(src.match(/(\d+)\.png$/)[1], 10);

    function modelFiguresOf(entry) {
      return registry ? entry.images.map(figureNo).filter((n) => registry.has(n)) : [];
    }

    function setFigMode(mode) {
      if (figMode === mode) return;
      figMode = mode;
      render();
    }

    function selectFigure(no) {
      if (selectedFig === no) return;
      selectedFig = no;
      render();
    }

    // 「第 N 種」交互參照:依圖號找到所在卡片
    function findEntry(no) {
      const target = "images/" + no + ".png";
      for (let c = 0; c < chapters.length; c++) {
        const i = chapters[c].entries.findIndex((e) => e.images.includes(target));
        if (i !== -1) return { c, i };
      }
      return null;
    }

    function jumpTo(no) {
      const found = findEntry(no);
      if (!found || (found.c === chapterIndex && found.i === entryIndex)) return;
      backStack.push({
        c: chapterIndex,
        i: entryIndex,
        no: chapters[chapterIndex].entries[entryIndex].no,
        fig: selectedFig,
      });
      chapterIndex = found.c;
      entryIndex = found.i;
      selectedFig = no; // 跳到多插圖條目時,選中被引用的那一張
      render();
    }

    function goBack() {
      const from = backStack.pop();
      if (!from) return;
      chapterIndex = from.c;
      entryIndex = from.i;
      selectedFig = from.fig;
      render();
    }

    // 把段落文字中的「第 N 種」轉成可點的連結
    function buildParagraph(text) {
      const p = document.createElement("p");
      // 支援「第 3 種」與「第 181 與 182 種」;複合參照連到第一個編號的卡片
      const re = /第\s*(\d+)(?:\s*與\s*\d+)*\s*種/g;
      let last = 0;
      let m;
      while ((m = re.exec(text))) {
        p.appendChild(document.createTextNode(text.slice(last, m.index)));
        const a = document.createElement("a");
        a.className = "xref";
        a.href = "#";
        a.textContent = m[0];
        const no = parseInt(m[1], 10);
        a.addEventListener("click", (e) => {
          e.preventDefault();
          jumpTo(no);
        });
        p.appendChild(a);
        last = m.index + m[0].length;
      }
      p.appendChild(document.createTextNode(text.slice(last)));
      return p;
    }

    // 圖片區左右半邊的翻頁提示:平時只露淡箭頭,滑到哪半邊才亮起
    function makeHint(side, glyph) {
      const hint = document.createElement("span");
      hint.className = "hint " + side;
      hint.setAttribute("aria-hidden", "true");
      const arrow = document.createElement("span");
      arrow.textContent = glyph;
      hint.appendChild(arrow);
      return hint;
    }

    // 圖片區下方的列:插圖 / 模型切換、模型模式下多插圖條目的圖號小頁籤,以及載入失敗提示
    function buildFigBar(modelFigs, showingModel, notice) {
      const bar = document.createElement("div");
      bar.className = "figbar";
      const toggle = document.createElement("div");
      toggle.className = "mode-toggle";
      toggle.setAttribute("role", "group");
      toggle.setAttribute("aria-label", "圖片區模式");
      for (const [mode, label] of [["illustration", "插圖"], ["model", "模型"]]) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = label;
        const on = (mode === "model") === showingModel;
        btn.classList.toggle("active", on);
        btn.setAttribute("aria-pressed", String(on));
        btn.addEventListener("click", () => setFigMode(mode));
        toggle.appendChild(btn);
      }
      bar.appendChild(toggle);
      if (showingModel && modelFigs.length > 1) {
        const tabs = document.createElement("div");
        tabs.className = "fig-tabs";
        for (const n of modelFigs) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = "圖 " + n;
          btn.classList.toggle("active", n === selectedFig);
          btn.setAttribute("aria-pressed", String(n === selectedFig));
          btn.addEventListener("click", () => selectFigure(n));
          tabs.appendChild(btn);
        }
        bar.appendChild(tabs);
      }
      if (notice) {
        const note = document.createElement("span");
        note.className = "fig-notice";
        note.textContent = notice;
        bar.appendChild(note);
      }
      return bar;
    }

    async function render() {
      const seq = ++renderSeq;
      const chapter = chapters[chapterIndex];
      const entry = chapter.entries[entryIndex];

      const modelFigs = modelFiguresOf(entry);
      if (!modelFigs.includes(selectedFig)) selectedFig = modelFigs[0] ?? null;

      // 模型模式:先把場景組好(第一次會等 3D 函式庫下載),再和卡片一起換上,避免閃白
      let session = null;
      let stage = null;
      let notice = "";
      if (figMode === "model" && modelFigs.length) {
        cardEl.querySelector(".mode-toggle")?.classList.add("loading");
        try {
          const viewer = await loadViewer();
          if (seq !== renderSeq) return;
          stage = document.createElement("div");
          stage.className = "stage";
          session = viewer.prepare(registry.get(selectedFig), stage);
        } catch (err) {
          console.error(err);
          if (seq !== renderSeq) return;
          figMode = "illustration";
          notice = "模型載入失敗,先顯示插圖;請檢查網路後重新整理頁面。";
        }
      }

      // 先在畫面外組好整張卡
      const fragment = document.createDocumentFragment();

      const atStart = chapterIndex === 0 && entryIndex === 0;
      const atEnd =
        chapterIndex === chapters.length - 1 &&
        entryIndex === chapter.entries.length - 1;
      const imgs = [];
      if (session) {
        // 左右留白的翻頁提示,和插圖模式一致
        if (!atStart) stage.appendChild(makeHint("prev", "‹"));
        if (!atEnd) stage.appendChild(makeHint("next", "›"));
        fragment.appendChild(stage);
      } else {
        const fig = document.createElement("div");
        fig.className = "fig";
        for (const src of entry.images) {
          const img = document.createElement("img");
          img.src = src;
          img.alt = "圖 " + entry.no;
          imgs.push(img);
          fig.appendChild(img);
        }
        if (!atStart) fig.appendChild(makeHint("prev", "‹"));
        if (!atEnd) fig.appendChild(makeHint("next", "›"));
        fragment.appendChild(fig);
      }
      if (modelFigs.length) fragment.appendChild(buildFigBar(modelFigs, !!session, notice));

      const no = document.createElement("div");
      no.className = "no";
      no.textContent = "圖 " + entry.no;
      fragment.appendChild(no);

      const body = document.createElement("div");
      body.className = "body";
      for (const paragraph of entry.text) {
        body.appendChild(buildParagraph(paragraph));
      }
      fragment.appendChild(body);

      // 等所有圖片解碼完成才換上去,避免空白閃爍
      try {
        await Promise.all(imgs.map((img) => img.decode()));
      } catch (_) {
        // 個別圖片壞掉就照常顯示(破圖示意),不擋整張卡
      }
      if (seq !== renderSeq) {
        session?.dispose(); // 期間又翻頁了,放棄這次結果
        return;
      }

      cardEl.replaceChildren(fragment);
      if (session) session.activate();
      else viewerModule?.deactivate();

      tabsEl.querySelectorAll("button").forEach((btn, i) => {
        btn.classList.toggle("active", i === chapterIndex);
      });
      posEl.textContent = (entryIndex + 1) + " / " + chapter.entries.length;
      prevBtn.disabled = atStart;
      nextBtn.disabled = atEnd;
      const figCount = chapter.entries.reduce((sum, e) => sum + e.images.length, 0);
      footerEl.textContent = chapter.title + " · 共 " + figCount + " 圖";

      const from = backStack[backStack.length - 1];
      backEl.hidden = !from;
      if (from) backEl.textContent = "‹ 返回 圖 " + from.no;

      preloadAround();
    }

    // 預載當前卡片前後各 2 張的圖,圖庫再大開啟也不變慢
    const preloaded = new Set();
    function preloadAround() {
      const entries = chapters[chapterIndex].entries;
      for (let d = -2; d <= 2; d++) {
        const entry = entries[entryIndex + d];
        if (!entry) continue;
        for (const src of entry.images) {
          if (preloaded.has(src)) continue;
          preloaded.add(src);
          new Image().src = src;
        }
      }
    }

    // 翻越章節邊界時自動切到前一章末張/下一章首張
    function step(delta) {
      let c = chapterIndex;
      let i = entryIndex + delta;
      if (i < 0) {
        if (c === 0) return;
        c -= 1;
        i = chapters[c].entries.length - 1;
      } else if (i >= chapters[c].entries.length) {
        if (c === chapters.length - 1) return;
        c += 1;
        i = 0;
      }
      backStack.length = 0; // 手動翻頁即離開參照脈絡,返回鍵消失
      chapterIndex = c;
      entryIndex = i;
      selectedFig = null;
      render();
    }

    prevBtn.addEventListener("click", () => step(-1));
    nextBtn.addEventListener("click", () => step(1));

    // 點圖片區左半邊=上一張,右半邊=下一張;文字區不翻頁,保留選取複製。
    // 模型模式下,3D 畫面與控制項是在操作模型,只有它們以外的留白才翻頁
    cardEl.addEventListener("click", (e) => {
      const area = e.target.closest(".fig, .stage");
      if (!area) return;
      if (area.matches(".stage") && e.target.closest(".stage-view, button, input, label")) return;
      const rect = area.getBoundingClientRect();
      step(e.clientX - rect.left < rect.width / 2 ? -1 : 1);
    });

    backEl.addEventListener("click", goBack);

    document.addEventListener("keydown", (e) => {
      if (e.target.closest?.("input, select, textarea")) return; // 例如調整速度滑桿時不翻頁
      if (e.key === "ArrowLeft") step(-1);
      if (e.key === "ArrowRight") step(1);
      if (e.key === "Escape") goBack();
    });

    // 手機左右滑動換頁;模型區上的手勢是在操作模型,不翻頁
    let touchX = null;
    cardEl.addEventListener("touchstart", (e) => {
      if (e.target.closest(".stage")) {
        touchX = null;
        return;
      }
      touchX = e.changedTouches[0].clientX;
    }, { passive: true });
    cardEl.addEventListener("touchend", (e) => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      touchX = null;
      if (Math.abs(dx) < 50) return;
      step(dx < 0 ? 1 : -1);
    }, { passive: true });

    chapters.forEach((chapter, i) => {
      const btn = document.createElement("button");
      btn.textContent = chapter.title;
      btn.addEventListener("click", () => {
        backStack.length = 0; // 手動切章視為新的閱讀起點
        chapterIndex = i;
        entryIndex = 0;
        selectedFig = null;
        render();
      });
      tabsEl.appendChild(btn);
    });

    render();
  </script>
</body>
</html>
